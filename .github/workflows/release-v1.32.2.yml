name: Build and publish Pocket Portable v1.32.2

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  portable-release:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[release v1.32.2]')
    runs-on: windows-latest
    env:
      POCKET_RELEASE_VERSION: v1.32.2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: x64
      - name: Install development dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Test Python application
        run: |
          python -m py_compile app.pyw
          python -m unittest discover -s tests -p "test_*.py" -v
      - name: Build COMPLETE self-contained Windows Portable ZIP
        shell: cmd
        run: call build-portable.bat
      - name: Verify release privacy and archive checksums
        shell: python
        run: |
          from pathlib import Path
          import hashlib
          import zipfile
          path = Path("dist/Pocket-Portable-v1.32.2.zip")
          assert path.is_file() and path.stat().st_size > 1_000_000
          with zipfile.ZipFile(path) as archive:
              names = archive.namelist()
              assert archive.testzip() is None
              assert "Pocket-Portable/PocketDesk.exe" in names
              assert "Pocket-Portable/portable.flag" in names
              assert "Pocket-Portable/bundle-manifest.sha256" in names
              assert "Pocket-Portable/Verify-Pocket.ps1" in names
              assert "Pocket-Portable/README.txt" in names
              assert any(n.endswith("/commands/example_commands.json") for n in names)
              forbidden_files = {"commands.json", "data.json", "data-recovery.json",
                                 "vendors.json", ".env"}
              forbidden_dirs = {"data", "notepad", "backups", "notepad_exports"}
              for name in names:
                  parts = name.split("/")
                  assert not any(p in forbidden_files for p in parts), name
                  assert not any(p.startswith("data-corrupt-") and p.endswith(".json") for p in parts), name
                  assert not any(p in forbidden_dirs for p in parts[:-1]), name
          digest = hashlib.sha256(path.read_bytes()).hexdigest()
          Path("dist/SHA256SUMS.txt").write_text(
              f"{digest}  {path.name}\n", encoding="ascii")
          print("PASS: downloadable app is complete and excludes personal data")
      - name: Test the extracted ZIP and actual executable on Windows
        run: python tests/integration/check_packaged_release.py --version v1.32.2 --portable-only
      - name: Upload final app as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pocket-Portable-v1.32.2-Windows
          path: dist/Pocket-Portable-v1.32.2.zip
          retention-days: 30
          if-no-files-found: error
      - name: Publish downloadable GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.32.2
          name: Pocket v1.32.2 - Workplace Portable
          target_commitish: ${{ github.sha }}
          draft: false
          prerelease: false
          make_latest: true
          fail_on_unmatched_files: true
          body: |
            Ready-to-use Windows 10/11 Pocket app.
            Download **Pocket-Portable-v1.32.2.zip**, extract the entire archive
            to a local writable folder and run **PocketDesk.exe**.
            No Python installation, administrator rights, or internet required
            for the offline features. Keep the _internal folder alongside the EXE.
            Improved checks for _ctypes, unicodedata, _tkinter and Pillow DLLs;
            includes an offline SHA-256 integrity verifier. No user data or
            private command libraries are included.
            Corporate security policies may still require IT approval.
          files: |
            dist/Pocket-Portable-v1.32.2.zip
            dist/SHA256SUMS.txt
