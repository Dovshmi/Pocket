name: Publish Pocket v1.30.0-beta.1

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[release v1.30.0-beta.1]')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run regression tests
        run: python -m unittest discover -v
      - name: Build portable ZIP
        shell: cmd
        run: call build-portable.bat
      - name: Build standalone public EXE
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name Pocket-v1.30.0-beta.1 --icon assets/app.ico --collect-all tkinterdnd2 --hidden-import PIL --hidden-import PIL.ImageTk --add-data "assets/app.ico;assets" --add-data "commands/example_commands.json;commands" --distpath dist --workpath build/standalone-work app.pyw
          if ($LASTEXITCODE -ne 0) { throw 'Standalone EXE build failed' }
      - name: Verify public assets contain no private commands
        shell: python
        run: |
          import zipfile
          from pathlib import Path
          from hashlib import sha256
          folder = Path("dist")
          portable = folder / "Pocket-Portable-v1.30.0-beta.1.zip"
          exe = folder / "Pocket-v1.30.0-beta.1.exe"
          assert portable.is_file() and exe.is_file()
          with zipfile.ZipFile(portable) as z:
              names = z.namelist()
              assert "Pocket-Portable/PocketDesk.exe" in names
              assert any(n.endswith("/commands/example_commands.json") for n in names)
              assert not any(n.endswith("/data.json") or n.endswith("/commands.json") for n in names)
              assert z.testzip() is None
          lines = []
          for item in (portable, exe):
              assert item.stat().st_size > 1_000_000
              lines.append(f"{sha256(item.read_bytes()).hexdigest()}  {item.name}")
          (folder/"SHA256SUMS.txt").write_text("\n".join(lines)+"\n", encoding="ascii")
          print("Verified portable ZIP and standalone EXE")
      - name: Exercise real Tk layout and Extra Mini integration on Windows
        shell: pwsh
        run: python smoke_dashboard_integration.py
      - name: Smoke-test standalone executable
        shell: pwsh
        run: |
          $env:APPDATA = Join-Path $env:RUNNER_TEMP 'pocket-release-appdata'
          New-Item -ItemType Directory -Force -Path $env:APPDATA | Out-Null
          $p = Start-Process -FilePath (Join-Path (Get-Location) 'dist/Pocket-v1.30.0-beta.1.exe') -ArgumentList '--preview' -PassThru
          try {
            Start-Sleep -Seconds 10
            $p.Refresh()
            if ($p.HasExited) { throw "EXE exited unexpectedly: $($p.ExitCode)" }
          } finally {
            if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force }
          }
      - name: Publish latest public release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.30.0-beta.1
          target_commitish: ${{ github.sha }}
          name: Pocket v1.30.0-beta.1 — Smart Templates & Extra Mini
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: true
          make_latest: false
          fail_on_unmatched_files: true
          files: |
            dist/Pocket-Portable-v1.30.0-beta.1.zip
            dist/Pocket-v1.30.0-beta.1.exe
            dist/SHA256SUMS.txt
