name: Import current Pocket v1.40 Windows screenshots (one-time)
on:
  push:
    branches: [docs/readme-v140-visual-refresh]
    paths:
      - .github/workflows/import-v140-screenshots-once.yml
  workflow_dispatch:
permissions:
  actions: read
  contents: write

jobs:
  import-verified-ui-shots:
    if: github.repository == 'Dovshmi/Pocket'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download verified Windows GUI screenshots from main v1.40 CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/screen-captures"
          gh run download 45080242747 --repo "$GITHUB_REPOSITORY" \
            --name pocket-ui-Windows --dir "$RUNNER_TEMP/screen-captures"
      - name: Keep selected actual Windows screenshots only
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil
          source = Path(__import__("os").environ["RUNNER_TEMP"]) / "screen-captures"
          out = Path("docs/images/pocket-v140-real")
          out.mkdir(parents=True, exist_ok=True)
          names = [
              "dashboard_home.png", "dashboard_notes.png", "dashboard_commands.png",
              "dashboard_settings.png", "dashboard_subnet.png", "dashboard_mac.png",
              "dashboard_ports.png", "dashboard_clipboard.png", "dashboard_links.png",
              "mini_notes.png", "mini_commands.png", "mini_links.png",
              "mini_settings.png", "mini_clipboard_images.png", "extra_mini.png",
              "normal_ports.png", "normal_mac.png",
          ]
          for name in names:
              src = source / name
              data = src.read_bytes()
              assert data[:8] == bytes.fromhex("89504e470d0a1a0a"), f"Not a PNG: {name}"
              assert len(data) > 4000, f"Unexpected tiny image: {name}"
              shutil.copyfile(src, out / name)
          print(f"Imported {len(names)} verified, synthetic-profile Windows captures")
          PY
      - name: Commit screenshot assets only to isolated docs branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/images/pocket-v140-real
          if git diff --cached --quiet; then
            echo "Screenshots already stored"
          else
            git commit -m "docs: add real v1.40 Windows GUI screenshots from verified CI"
            git push origin HEAD:docs/readme-v140-visual-refresh
          fi
