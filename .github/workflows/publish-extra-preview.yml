name: Publish Pocket Extra Excel experimental ZIP

# One-time publication from the isolated experimental branch. No stable release
# or main-branch files are modified by this workflow.
on:
  push:
    branches:
      - experiment/extra-excel-lookup
    paths:
      - .github/workflows/publish-extra-preview.yml

permissions:
  actions: read
  contents: write

concurrency:
  group: pocket-extra-excel-preview-20261122-v140-menuorder-keyboard
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'Dovshmi/Pocket'
    runs-on: ubuntu-latest
    env:
      TAG: extra-excel-preview-20261120
      SOURCE_RUN_ID: '45067460053'
      SOURCE_COMMIT: '7cd148fc0ca8bd6e8d05f9b5300ffc62a5bf8162'
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download Windows ZIP from successfully tested Pocket build
        run: |
          mkdir -p incoming dist
          gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name Pocket-Development-Preview-Windows --dir incoming
          cp incoming/Pocket-Development-Preview.zip dist/Pocket-v1.40-Menu-Order-Extra-Keyboard-Portable.zip

      - name: Validate actual Windows EXE and ZIP integrity
        run: |
          python - <<'PY'
          import zipfile
          from pathlib import Path
          p = Path("dist/Pocket-v1.40-Menu-Order-Extra-Keyboard-Portable.zip")
          assert p.is_file() and p.stat().st_size > 1_000_000
          with zipfile.ZipFile(p) as z:
              assert z.testzip() is None, "ZIP archive failed integrity check"
              items = z.namelist()
              assert "Pocket-Portable/PocketDesk.exe" in items, "Portable EXE missing"
              assert any(n.startswith("Pocket-Portable/_internal/") for n in items), "Runtime missing"
              for n in items:
                  parts = n.split("/")
                  assert not any(part in ("data.json", "data-recovery.json", "commands.json", "vendors.json") for part in parts), "Private data found in archive"
          print("Verified tested portable ZIP and bundled PocketDesk.exe")
          PY
          (cd dist && sha256sum Pocket-v1.40-Menu-Order-Extra-Keyboard-Portable.zip > SHA256SUMS-v1.40-Menu-Order.txt)

      - name: Write experimental release notes
        run: |
          cat > release-notes.md <<'EOF'
          ## Pocket Extra — Excel lookup (experimental Windows preview)

          This ZIP includes `PocketDesk.exe` and the complete `_internal` portable runtime.
          Extract the ZIP first, then run `Pocket-Portable/PocketDesk.exe`.

          **Extra**: Select a local Excel workbook, search all sheets and columns,
          and view matching rows. Numeric group codes with separator differences
          (such as 8826004 / 88-26004) are matched. Workbook reading is local and
          read-only; no spreadsheet or customer data is bundled or uploaded.

          **Two modes in Extra:**
          - Local: identical read-only source Excel search as before. Protected
            files use locally installed Microsoft Excel with existing permissions.
          - Database: plain SQLite v2 on disk, with readable rows and indexed
            search tokens. No DPAPI, Windows-account decryption or encryption.
            Create or refresh it ONLY by pressing Sync database.
            Search never opens Excel or loads the workbook into RAM.
            Manual Sync verifies the new file before replacing the old file.

          **Migrating from encrypted SQLite v1:**
          A previous encrypted experimental database cannot be reused as-is.
          Pocket identifies the old format and requests one manual Sync from the
          Excel source. Cancelled or failed Sync preserves the old file.
          The source Excel file is never changed.

          **Pocket v1.40 — compact Extra and SOC workflow:**
          - Mini Excel source is now a single muted filename and Browse button,
            with full path available on hover, instead of a large input field.
          - Selected Row now shows a compact two-column overview:
            customer, actual line code, group code, VDOM, VRF, FG VLAN and
            computed FortiGate management address. Click the IP to copy it.
          - Show other columns unfolds every remaining populated Excel field
            in a bounded scrolling area, without losing their original order.
            The disclosure state is remembered between selected results.
          - Existing Matches list, Local/Database switch, manual plain-SQLite
            sync/import and Outlook SOC draft all remain available.
          - Outlook creates an UNSENT draft only, and keeps expert approval
            name immediately under the contact person.
          - **Excel shortcut reliability:** When an Excel workbook shortcut
            is clicked, a fresh Excel instance opens the requested file instead
            of reusing a previously open workbook via Windows DDE. Direct
            EXCEL.EXE shortcut starts with /x. Existing Office prompts and
            security policies remain in effect; other file shortcuts unchanged.
          - **Modern compact Settings:** Seven focusable accordion categories
            for Appearance, Shortcuts, Visible Tools, Clipboard, Quick Slots &
            Translate, Network & Extra, and Backup & Restore. Every existing
            preference/action is retained and opening a category does not
            modify saved settings. All three window modes tested.
          - **Extra keyboard:** Up/Down in Matches selects the adjacent row.
            Left/Right in Selected Row changes selection without extra buttons.
          - **Less vertical space:** Database Sync/Load DB/Delete and last sync
            share the Excel Source card. The Matches count is on the right
            of its heading, not a permanently empty status row.
          - **True Pocket icon reorder:** Visible Tools is directly under
            Appearance. Real locally drawn Pocket icons can be dragged to
            new positions or clicked twice (source/target), with a live Mini
            preview. More/Less remains fixed at the overflow slot.
          - Menu positions persist after restart and Settings backup/restore,
            including the positions of hidden tools; Reset menus restores
            defaults. Fonts no longer render Settings icons as '?' boxes.
          - All 4 Python-version/platform unit-test combinations, actual
            Windows/Linux Tk mouse drag and arrow navigation, and Windows
            production portable EXE smoke have passed.
          - Settings displays **v1.40** (semantic package version 1.40.0).
          - No customer workbook/database/credentials are bundled.
          - This is a separate EXPERIMENTAL preview. Stable main stays v1.39.9.

          IMPORTANT: The new SQLite database is NOT encrypted; anyone with
          filesystem access can read it. Manual Sync shows a confirmation
          about permission to store the data in plain SQLite. Keep the database
          and portable folder in a company-approved location.

          Built from the isolated `experiment/extra-excel-lookup` branch.
          This is a **pre-release**, not the stable Pocket v1.39.9 download.
          The packaged executable is unsigned and should only be used when
          workplace policies permit it.
          EOF

      - name: Publish GitHub pre-release with direct ZIP download
        run: |
          # Add a new, distinctly named asset. Keep the original preview intact.
          gh release upload "$TAG" dist/Pocket-v1.40-Menu-Order-Extra-Keyboard-Portable.zip dist/SHA256SUMS-v1.40-Menu-Order.txt \
            --repo "$GITHUB_REPOSITORY"

          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json url,assets,isPrerelease
