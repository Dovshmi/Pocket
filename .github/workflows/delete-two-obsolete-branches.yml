name: One-time cleanup of two obsolete Pocket branches

on:
  push:
    branches:
      - experiment/workplace-pac-proxy

permissions:
  contents: write

jobs:
  delete-explicit-branches:
    runs-on: ubuntu-latest
    steps:
      - name: Delete the two user-requested branches only
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "Dovshmi/Pocket"
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/feature/dashdash-remote-port-check" --silent
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/test-branch" --silent
          echo "Deleted: feature/dashdash-remote-port-check and test-branch"
