name: Publish Pocket Extra Excel experimental ZIP

# One-time publication from the isolated experimental branch. No stable release
# or main-branch files are modified by this workflow.
on:
  push:
    branches:
      - experiment/extra-excel-lookup
    paths:
      - .github/workflows/publish-extra-preview.yml

permissions:
  actions: read
  contents: write

concurrency:
  group: pocket-extra-excel-preview-20261122-soc-expert-order
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'Dovshmi/Pocket'
    runs-on: ubuntu-latest
    env:
      TAG: extra-excel-preview-20261120
      SOURCE_RUN_ID: '44967512467'
      SOURCE_COMMIT: 'd8de0984488eec1f34019dd9d4e9e8023ca56dda'
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download Windows ZIP from successfully tested Pocket build
        run: |
          mkdir -p incoming dist
          gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name Pocket-Development-Preview-Windows --dir incoming
          cp incoming/Pocket-Development-Preview.zip dist/Pocket-Extra-SOC-Expert-Below-Contact-Portable.zip

      - name: Validate actual Windows EXE and ZIP integrity
        run: |
          python - <<'PY'
          import zipfile
          from pathlib import Path
          p = Path("dist/Pocket-Extra-SOC-Expert-Below-Contact-Portable.zip")
          assert p.is_file() and p.stat().st_size > 1_000_000
          with zipfile.ZipFile(p) as z:
              assert z.testzip() is None, "ZIP archive failed integrity check"
              items = z.namelist()
              assert "Pocket-Portable/PocketDesk.exe" in items, "Portable EXE missing"
              assert any(n.startswith("Pocket-Portable/_internal/") for n in items), "Runtime missing"
              for n in items:
                  parts = n.split("/")
                  assert not any(part in ("data.json", "data-recovery.json", "commands.json", "vendors.json") for part in parts), "Private data found in archive"
          print("Verified tested portable ZIP and bundled PocketDesk.exe")
          PY
          (cd dist && sha256sum Pocket-Extra-SOC-Expert-Below-Contact-Portable.zip > SHA256SUMS-SOC-Expert-Order.txt)

      - name: Write experimental release notes
        run: |
          cat > release-notes.md <<'EOF'
          ## Pocket Extra — Excel lookup (experimental Windows preview)

          This ZIP includes `PocketDesk.exe` and the complete `_internal` portable runtime.
          Extract the ZIP first, then run `Pocket-Portable/PocketDesk.exe`.

          **Extra**: Select a local Excel workbook, search all sheets and columns,
          and view matching rows. Numeric group codes with separator differences
          (such as 8826004 / 88-26004) are matched. Workbook reading is local and
          read-only; no spreadsheet or customer data is bundled or uploaded.

          **Two modes in Extra:**
          - Local: identical read-only source Excel search as before. Protected
            files use locally installed Microsoft Excel with existing permissions.
          - Database: plain SQLite v2 on disk, with readable rows and indexed
            search tokens. No DPAPI, Windows-account decryption or encryption.
            Create or refresh it ONLY by pressing Sync database.
            Search never opens Excel or loads the workbook into RAM.
            Manual Sync verifies the new file before replacing the old file.

          **Migrating from encrypted SQLite v1:**
          A previous encrypted experimental database cannot be reused as-is.
          Pocket identifies the old format and requests one manual Sync from the
          Excel source. Cancelled or failed Sync preserves the old file.
          The source Excel file is never changed.

          **New in this build: SOC Outlook draft**
          - After a Local or Database search, select a row and click
            Outlook · SOC beside the selected-row details.
          - Fill customer/business name, circuit/line code and VDOM from
            matching Excel columns; calculate the FortiGate management IP
            from known FG worksheet naming, e.g. FG25 => 10.238.2.25 or
            FG-2.8-METRO1 => 10.238.2.8.
          - Prefill the subject as customer + line code + פנייה לSOC.
          - Leave contact person, expert-approval NAME, phone number, fault
            description and previous ticket for the user to complete in Outlook.
          - Expert-approval NAME now appears immediately below contact person
            in both classic Outlook HTML and New Outlook plain text.
          - Missing values are flagged and never invented; the user must
            review the draft. No recipient is set and NO email is sent.
          - Classic Outlook uses a new unsent COM draft, preserving the
            signature; otherwise Windows default mailto handles New Outlook.
          - Previous Local/Database search and Mini switch layout are retained.

          IMPORTANT: The new SQLite database is NOT encrypted; anyone with
          filesystem access can read it. Manual Sync shows a confirmation
          about permission to store the data in plain SQLite. Keep the database
          and portable folder in a company-approved location.

          Built from the isolated `experiment/extra-excel-lookup` branch.
          This is a **pre-release**, not the stable Pocket v1.39.9 download.
          The packaged executable is unsigned and should only be used when
          workplace policies permit it.
          EOF

      - name: Publish GitHub pre-release with direct ZIP download
        run: |
          # Add a new, distinctly named asset. Keep the original preview intact.
          gh release upload "$TAG" dist/Pocket-Extra-SOC-Expert-Below-Contact-Portable.zip dist/SHA256SUMS-SOC-Expert-Order.txt \
            --repo "$GITHUB_REPOSITORY"

          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json url,assets,isPrerelease
