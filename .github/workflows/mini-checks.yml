name: Pocket regression checks

on:
  push:
    branches: [main, before-release, feature/smart-command-templates, feature/extra-mini-dynamic-pages-ui-polish, chore/repository-cleanup-v131]
  pull_request:
    branches: [main, feature/dashboard-ui-refresh]
  workflow_dispatch:

jobs:
  unit-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Pocket
        run: python -m py_compile app.pyw mini_layout.py dashboard_ui.py compact_dashboard.py settings_ui.py pocket_design.py quick_search.py clipboard_policy.py smart_templates.py template_ui.py launcher_pages.py launcher_picker.py launcher_extra_ui.py native_bidi.py note_sync.py single_instance.py tool_icons.py normal_navigation.py
      - name: Run unit tests
        run: python -m unittest discover -v

  gui-smoke:
    permissions:
      contents: write  # Only used for an explicitly tagged screenshot refresh on main.
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Install virtual desktop (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: Exercise Pocket UI (Windows)
        if: runner.os == 'Windows'
        env:
          POCKET_AUDIT_SCREENSHOTS: ${{ runner.temp }}/pocket-ui-audit
        run: python tests/integration/smoke_dashboard_integration.py
      - name: Exercise Pocket UI (Linux virtual display)
        if: runner.os == 'Linux'
        env:
          POCKET_AUDIT_SCREENSHOTS: ${{ runner.temp }}/pocket-ui-audit
        run: xvfb-run -a -s "-screen 0 1920x1200x24" python tests/integration/smoke_dashboard_integration.py
      # A one-time, opt-in documentation refresh. Ordinary test runs do not
      # mutate tracked images or cause screenshot-only commit noise.
      - name: Publish selected real Windows screenshots for README
        if: ${{ runner.os == 'Windows' && github.event_name == 'push' && contains(github.event.head_commit.message, '[refresh screenshots]') }}
        shell: pwsh
        env:
          POCKET_AUDIT_SCREENSHOTS: ${{ runner.temp }}/pocket-ui-audit
        run: |
          $destination = 'docs/images/pocket-v130-real'
          New-Item -ItemType Directory -Force -Path $destination | Out-Null
          $names = @(
            'dashboard_home.png', 'dashboard_notes.png',
            'dashboard_commands.png', 'dashboard_subnet.png',
            'dashboard_clipboard.png', 'dashboard_settings.png',
            'normal_notes.png', 'normal_commands.png',
            'normal_ports.png', 'normal_mac.png',
            'mini_notes.png', 'mini_commands.png',
            'extra_mini.png'
          )
          foreach ($name in $names) {
            $source = Join-Path $env:POCKET_AUDIT_SCREENSHOTS $name
            if (-not (Test-Path -LiteralPath $source)) {
              throw "Expected real Windows Tk screenshot is missing: $name"
            }
            Copy-Item -LiteralPath $source -Destination (Join-Path $destination $name)
          }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- $destination
          if (git diff --cached --quiet) {
            Write-Output 'Screenshots are already current'
          } else {
            git commit -m 'docs: add actual Pocket v1.30.0 Windows UI screenshots'
            git push origin HEAD:main
          }

      - name: Upload real Tk UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pocket-ui-${{ runner.os }}
          path: ${{ runner.temp }}/pocket-ui-audit/*.png
          if-no-files-found: warn

  portable-build-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build production-style Windows portable ZIP
        shell: cmd
        run: call build-portable.bat
      - name: Verify portable contents and privacy exclusions
        shell: python
        run: |
          import zipfile
          from pathlib import Path
          artifact = Path("dist/Pocket-Portable-v1.30.0.zip")
          assert artifact.is_file(), "No portable ZIP produced"
          with zipfile.ZipFile(artifact) as archive:
              names = archive.namelist()
              assert "Pocket-Portable/PocketDesk.exe" in names
              assert any(name.endswith("/commands/example_commands.json") for name in names)
              forbidden = ("data.json", "vendors.json", "notepad/", "backups/", "commands/commands.json")
              for path in names:
                  assert not any(path.endswith(f) for f in forbidden), f"Sensitive data packaged: {path}"
              assert archive.testzip() is None, "ZIP integrity failure"
          print("PASS: runnable portable EXE is packaged with only the public command seed")
      - name: Make downloadable branch-preview ZIP
        shell: pwsh
        run: Copy-Item 'dist/Pocket-Portable-v1.30.0.zip' 'dist/Pocket-SmartTemplates-ExtraMini-Preview.zip'
      - name: Upload development preview (not a GitHub release)
        uses: actions/upload-artifact@v4
        with:
          name: Pocket-SmartTemplates-ExtraMini-Preview-Windows
          path: dist/Pocket-SmartTemplates-ExtraMini-Preview.zip
          if-no-files-found: error
          retention-days: 14
      - name: Launch packaged Pocket EXE in isolated preview mode
        shell: pwsh
        run: |
          $exe = Join-Path (Get-Location) 'build/portable-binaries/PocketDesk/PocketDesk.exe'
          if (-not (Test-Path $exe)) { throw 'Packaged EXE missing' }
          $profile = Join-Path $env:RUNNER_TEMP 'pocket-exe-smoke-profile'
          New-Item -ItemType Directory -Force -Path $profile | Out-Null
          $env:APPDATA = $profile
          $proc = Start-Process -FilePath $exe -ArgumentList '--preview' -PassThru
          try {
            Start-Sleep -Seconds 8
            $proc.Refresh()
            if ($proc.HasExited) { throw "Pocket EXE exited early ($($proc.ExitCode))" }
            Write-Output 'PASS: packaged Pocket EXE starts and remains running in preview mode'
          } finally {
            if (-not $proc.HasExited) { Stop-Process -Id $proc.Id -Force }
          }
