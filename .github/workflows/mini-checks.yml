name: Pocket regression checks

on:
  push:
    branches: [main, before-release]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  unit-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Pocket
        run: python -m py_compile app.pyw mini_layout.py dashboard_ui.py compact_dashboard.py settings_ui.py native_bidi.py note_sync.py single_instance.py
      - name: Run unit tests
        run: python -m unittest discover -v
