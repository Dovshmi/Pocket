name: Publish Pocket v1.43.0 (Modern Search, Smart Clipboard and EXTRA)

# Release only from main after explicitly approved release-marker merge,
# or manual workflow dispatch. Never publish from an unreviewed PR branch.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      confirm_version:
        description: "Type v1.43.0 to approve Windows release publication"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: pocket-release-v1.43.0
  cancel-in-progress: false

jobs:
  release:
    if: >-
      github.repository == 'Dovshmi/Pocket' && github.ref == 'refs/heads/main' &&
      ((github.event_name == 'push' &&
      contains(github.event.head_commit.message, '[release v1.43.0]')) ||
      (github.event_name == 'workflow_dispatch' && inputs.confirm_version == 'v1.43.0'))
    runs-on: windows-latest
    env:
      POCKET_RELEASE_VERSION: v1.43.0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: x64
      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Compile Pocket and run all unit tests
        shell: pwsh
        run: |
          python -c "from pocket import app_info; assert app_info.VERSION == '1.43.0', 'Release version mismatch'"
          python -m py_compile app.pyw
          python -m compileall -q pocket
          python -m unittest discover -s tests -p "test_*.py" -v
          if ($LASTEXITCODE -ne 0) { throw 'Unit tests failed' }
      - name: Test Normal, Mini, Dashboard and Extra Mini UI
        run: python tests/integration/smoke_dashboard_integration.py
      - name: Verify adaptive sizing, MAC and ports, and repeatable Ctrl+K palette
        run: python tests/integration/smoke_adaptive_v141.py
      - name: Verify real native keyboard focus and borderless Ctrl+K
        id: native_focus
        continue-on-error: true
        run: python tests/integration/smoke_palette_focus_v143.py
      - name: Test native Windows input controls and keyboard editing
        run: |
          python tests/integration/smoke_native_inputs.py
          python tests/integration/smoke_text_edit.py
      - name: Test real Quick Slot copy and Windows hotkey registration
        run: |
          python tests/integration/probe_quick_slots_win32.py
          python tests/integration/smoke_quick_slots_selection.py
      - name: Verify ASCII, Hebrew paste and independently configurable Quick Slot modes
        run: python tests/integration/smoke_quick_slots_paste.py
      - name: Verify native Windows Old-to-New confirmation
        run: python tests/integration/smoke_quick_slot_replace.py
      - name: Test ordinary Mini dropdown selection (no typeahead)
        run: python tests/integration/smoke_picker_selection.py
      - name: Exercise standalone and Note-linked Reminders popup
        run: python tests/integration/smoke_notes_reminders_v1399.py
      - name: Exercise v1.40 menu order, Show-Hide and Extra keyboard navigation
        run: |
          python tests/integration/smoke_menu_order_v140.py
          python tests/integration/smoke_extra_arrows_v140.py
      - name: Build complete portable ZIP
        shell: cmd
        run: call build-portable.bat
      - name: Build standalone Windows EXE
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --noupx --name Pocket-v1.43.0 --icon assets/app.ico --collect-all PIL --collect-all tkinterdnd2 --collect-all openpyxl --collect-all xlrd --hidden-import win32com.client --hidden-import win32com.client.dynamic --hidden-import pythoncom --hidden-import pywintypes --hidden-import PIL._imaging --hidden-import PIL._imagingtk --hidden-import _ctypes --hidden-import _tkinter --hidden-import unicodedata --add-data "assets/app.ico;assets" --add-data "commands/example_commands.json;commands" --distpath dist --workpath build/standalone-work app.pyw
          if ($LASTEXITCODE -ne 0) { throw 'Standalone EXE build failed' }
      - name: Validate privacy, ZIP integrity, assets and checksums
        shell: python
        run: |
          import hashlib
          import zipfile
          from pathlib import Path
          folder = Path('dist')
          archive_path = folder / 'Pocket-Portable-v1.43.0.zip'
          exe_path = folder / 'Pocket-v1.43.0.exe'
          assert archive_path.is_file() and archive_path.stat().st_size > 1_000_000
          assert exe_path.is_file() and exe_path.stat().st_size > 1_000_000
          with zipfile.ZipFile(archive_path) as z:
              assert z.testzip() is None
              names = z.namelist()
              for required in ('Pocket-Portable/PocketDesk.exe',
                               'Pocket-Portable/portable.flag',
                               'Pocket-Portable/bundle-manifest.sha256',
                               'Pocket-Portable/Verify-Pocket.ps1',
                               'Pocket-Portable/README.txt'):
                  assert required in names, required
              assert any(n.endswith('/commands/example_commands.json') for n in names)
              assert 'v1.43.0' in z.read('Pocket-Portable/README.txt').decode('utf-8')
              forbidden_files = {'data.json', 'data-recovery.json', 'commands.json',
                                 'vendors.json', '.env'}
              forbidden_dirs = {'data', 'notepad', 'backups', 'notepad_exports', 'ClipboardDatabase'}
              confidential_suffixes = ('.sqlite3', '.sqlite', '.db', '.db3', '.xlsx', '.xlsm', '.xlsb', '.xls')
              for name in names:
                  parts = name.split('/')
                  assert not any(part in forbidden_files for part in parts), name
                  assert not any(part.startswith('data-corrupt-') and
                                 part.endswith('.json') for part in parts), name
                  assert not any(part in forbidden_dirs for part in parts[:-1]), name
                  assert not name.lower().endswith(confidential_suffixes), name
          sums = []
          for path in (archive_path, exe_path):
              sums.append(f"{hashlib.sha256(path.read_bytes()).hexdigest()}  {path.name}")
          (folder / 'SHA256SUMS.txt').write_text('\n'.join(sums) + '\n', encoding='ascii')
          print('PASS: self-contained public packages and SHA-256 checksums')
      - name: Test extracted portable ZIP, native DLLs and GUI
        run: python tests/integration/check_packaged_release.py --version v1.43.0 --portable-only
      - name: Test standalone dependencies and GUI startup
        shell: pwsh
        run: |
          $env:APPDATA = Join-Path $env:RUNNER_TEMP 'pocket-v143-standalone-profile'
          New-Item -ItemType Directory -Force -Path $env:APPDATA | Out-Null
          $exe = Join-Path (Get-Location) 'dist/Pocket-v1.43.0.exe'
          # A windowed PyInstaller EXE can return control to PowerShell
          # before it exits. Wait for its real exit code, not $LASTEXITCODE.
          $diagnostic = Join-Path $env:RUNNER_TEMP 'pocket-v143-standalone-diagnostics.log'
          $deps = Start-Process -FilePath $exe -ArgumentList @('--self-test-deps', "--deps-log=$diagnostic") -Wait -PassThru
          if ($deps.ExitCode -ne 0) {
            if (Test-Path -LiteralPath $diagnostic) {
              Get-Content -LiteralPath $diagnostic
            }
            throw "Standalone dependency self-test failed: exit $($deps.ExitCode)"
          }
          $process = Start-Process -FilePath $exe -ArgumentList '--preview' -PassThru
          try {
            Start-Sleep -Seconds 9
            $process.Refresh()
            if ($process.HasExited) { throw "Standalone EXE exited unexpectedly: $($process.ExitCode)" }
          } finally {
            if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force }
          }
      - name: Verify expected public release files
        shell: pwsh
        run: |
          $required = @('Pocket-Portable-v1.43.0.zip', 'Pocket-v1.43.0.exe', 'SHA256SUMS.txt')
          foreach ($name in $required) {
            if (-not (Test-Path -LiteralPath (Join-Path 'dist' $name))) {
              throw "Release file missing: $name"
            }
          }
          if ((Get-Content -LiteralPath 'dist/SHA256SUMS.txt').Count -ne 2) {
            throw 'Expected exactly two SHA-256 hash lines'
          }
      - name: Record release verification status
        shell: pwsh
        run: |
          if ('${{ steps.native_focus.outcome }}' -ne 'success') {
            Add-Content -Path docs/releases/v1.43.0.md -Value "`n**Preview — known limitation:** The strict Windows native Ctrl+K focus regression did not pass in CI. The general GUI tests and packaged runtime checks passed. Use Escape and reopen or click the search field if keyboard focus does not transfer. v1.42.0 remains the stable release."
          }
      - name: Publish v1.43.0 (stable only when native focus passes)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.43.0
          target_commitish: ${{ github.sha }}
          name: Pocket v1.43.0 — Modern Search, Smart Clipboard & EXTRA
          body_path: docs/releases/v1.43.0.md
          draft: false
          prerelease: ${{ steps.native_focus.outcome != 'success' }}
          make_latest: ${{ steps.native_focus.outcome == 'success' && 'true' || 'false' }}
          fail_on_unmatched_files: true
          files: |
            dist/Pocket-Portable-v1.43.0.zip
            dist/Pocket-v1.43.0.exe
            dist/SHA256SUMS.txt
